  <title id="figure-title">Intervention log payload cost in a phase-1 deny microbenchmark</title>
  <desc id="figure-description">12 paired rounds compare intervention payload enabled and disabled. The data contain 12 positive, 0 negative, and 0 zero paired differences. The paired median enabled-minus-disabled difference is 5.418 microseconds per transaction, with an exact 96.1 percent nonparametric interval from 5.381 to 5.480 microseconds.</desc>
