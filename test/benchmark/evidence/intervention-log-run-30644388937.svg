  <title id="figure-title">Paired phase-1 deny benchmark</title>
  <desc id="figure-description">12 paired round aggregates compare intervention log payload enabled and disabled. Payload disabled had a lower sample mean in 12 rounds. The median enabled-minus-disabled difference was 5.541 microseconds per transaction; its exact 96.1 percent order-statistic interval was 5.517 to 6.157 microseconds.</desc>
